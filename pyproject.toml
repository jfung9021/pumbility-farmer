[project]
name = "pumbility-farmer"
version = "2.1.0"
description = "Phoenix 2 scoring-difficulty analysis with durable Vercel queue workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery==5.6.3",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "requests==2.32.4",
    "vercel==0.8.1",
]

[[tool.vercel.subscribers]]
entrypoint = "worker.run:app"
topics = ["analysis"]

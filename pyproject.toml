[project]
name = "pumbility-farmer"
version = "3.0.0"
description = "Phoenix 1 and Phoenix 2 scoring-difficulty analysis with durable Vercel queue workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery==5.6.3",
    "fastapi==0.117.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "psycopg[binary]>=3.2,<4",
    "requests==2.32.4",
    "vercel==0.8.1",
    "vercel-workers==0.0.25",
]

[tool.vercel]
entrypoint = "api_service:app"

[[tool.vercel.subscribers]]
entrypoint = "worker.run:app"
topics = ["analysis"]

[[tool.vercel.subscribers]]
entrypoint = "worker.player_run:app"
topics = ["player-recommendations"]
max_concurrency = 4
